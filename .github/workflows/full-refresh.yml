name: Manual full refresh
run-name: Full refresh · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Refresh request identifier (24 lowercase hex characters)
        required: true
        type: string

concurrency:
  group: concert-monitor-full-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Deterministic refresh, optional enrich and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FULL_REFRESH_ID: ${{ inputs.request_id }}
      LLM_ENRICH_PROVIDER: ${{ vars.LLM_ENRICH_PROVIDER || 'none' }}
      LLM_ENRICH_MAX_COST_CNY: ${{ vars.LLM_ENRICH_MAX_COST_CNY || '5' }}
      LLM_ENRICH_MAX_COST_PER_ARTIST_CNY: ${{ vars.LLM_ENRICH_MAX_COST_PER_ARTIST_CNY || '5' }}
      LLM_ENRICH_MAX_CONTEXT_BYTES: ${{ vars.LLM_ENRICH_MAX_CONTEXT_BYTES || '128000' }}
      LLM_ENRICH_ATTEMPTS: ${{ vars.LLM_ENRICH_ATTEMPTS || '1' }}
      KIMI_RESEARCH_MODEL: ${{ vars.KIMI_RESEARCH_MODEL || 'kimi-k3' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate refresh request
        shell: bash
        run: |
          if [[ ! "$FULL_REFRESH_ID" =~ ^[a-f0-9]{24}$ ]]; then
            echo "request_id must be exactly 24 lowercase hexadecimal characters" >&2
            exit 2
          fi

      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

      # The script contains the optional-enrichment fallback. Do not add
      # continue-on-error here: deterministic collection/build failures must
      # stop the commit, while a missing/exhausted LLM key returns success only
      # after telemetry records the stale/failed enrichment state.
      - name: Run deterministic refresh with optional LLM enrichment
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          REFRESH_TELEMETRY_OUTPUT: ${{ runner.temp }}/full-refresh-telemetry.json
          REFRESH_ENRICH_CANDIDATE_OUTPUT: ${{ runner.temp }}/full-refresh-candidate.json
        run: python3 scripts/full_refresh.py

      - name: Upload sanitized usage telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-refresh-telemetry-${{ inputs.request_id }}
          path: ${{ runner.temp }}/full-refresh-telemetry.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload isolated enrichment candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-refresh-candidate-${{ inputs.request_id }}
          path: ${{ runner.temp }}/full-refresh-candidate.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Candidate artifacts are never staged; only deterministic outputs may ship.
          git add config data site/data.js site/data.json
          if git diff --cached --quiet; then
            echo "No snapshot files changed."
            exit 0
          fi
          # 不能带 [skip ci]：这次 push 正是用来触发 Vercel 发布新快照。
          git commit -m "data: complete manual refresh"
          # 快照必须对应 checkout 时的同一份配置和代码。若 main 在
          # 调研期间前进，push 应 non-fast-forward 失败并由管理员重跑，
          # 不能把基于旧艺人清单生成的数据 rebase 后伪装成新 main 的完整快照。
          git push origin HEAD:main
