<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演唱会监控</title>
<script>
/* 主题初始化：默认亮色，读取本地记忆；放在样式表前避免闪烁 */
try{document.documentElement.dataset.theme = localStorage.getItem("cm-theme") || "light";}
catch(_){document.documentElement.dataset.theme = "light";}
</script>
<!-- 不引任何外部资源：外链字体是渲染阻塞资源，fonts.googleapis.com 在国内不可达时
     会让整页白屏等到超时。本机装了 JetBrains Mono 就用，没有则回退到系统等宽字体
     （macOS/iOS 上是 SF Mono / Menlo，观感基本一致）。 -->
<style>
:root{
  --paper:#FAF6EF; --ink:#1b1611; --card:#fff; --hard:#1b1611;
  --green:#4F9D69; --green-dk:#35724b; --yellow:#FDFF8B; --amber-dk:#9c6200;
  --pink:#F7AEF8; --mag-dk:#b23ab8; --pop:#f0492f;
  --line:#e8e0d2; --dim:#6d6255; --faint:#766b5d;
  --stickbg:rgba(250,246,239,.88); --emptybg:rgba(255,255,255,.5); --dashline:#c9bfa9;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --paper:#15130f; --ink:#f0eae0; --card:#1f1c17; --hard:#000;
  --green-dk:#6fc98c; --amber-dk:#e8bc55; --mag-dk:#e6a3e7; --pop:#ff6a52;
  --line:#332e26; --dim:#a79c8b; --faint:#877d6f;
  --stickbg:rgba(21,19,15,.9); --emptybg:rgba(255,255,255,.03); --dashline:#332e26;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 22px 90px}
.lb{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* header */
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:20px 0 16px}
.wordmark{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}
.wordmark .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);
  background:conic-gradient(var(--pink),var(--yellow),var(--green),var(--pink))}
header .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-align:right}
.full-updated{color:var(--dim);font-weight:700;letter-spacing:.02em}
.full-updated .fresh-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-right:6px;vertical-align:1px}
.refresh-meta{font-size:9.5px;margin-top:1px}
/* header 是 align-items:baseline，按钮没有文字基线会被按底边对齐到首行基线上，
   而 meta 是两行、其视觉中心更低 —— 单靠 align-self:center 只能相对整个 header
   居中，跟不了 meta。把两者放进同一个居中容器，才能不论 meta 有几行都对齐。 */
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-actions{display:flex;align-items:center;gap:2px}
.iconbtn{flex:none;width:44px;height:44px;border:none;border-radius:0;
  background:none;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:0;transition:color .15s var(--ease)}
.iconbtn:hover{color:var(--ink)}
.iconbtn:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.iconbtn:disabled{cursor:wait;color:var(--faint)}
/* 只设尺寸，不要在这里写 display —— 否则会盖掉下面按主题切换图标的规则，
   导致太阳和月亮同时显示、被挤在一起。 */
.iconbtn svg{width:16px;height:16px}
.themebtn .ic-sun{display:none}
.themebtn .ic-moon{display:block}
.refreshbtn.is-loading svg{animation:refresh-spin .85s linear infinite}
@keyframes refresh-spin{to{transform:rotate(360deg)}}

/* 完整刷新是后台任务：只在执行/失败时展开轻量状态条，不挤占日常阅读重心 */
.refreshpanel{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);padding:8px 11px;margin:0 0 13px;color:var(--dim);font-size:12px}
.refreshpanel[hidden]{display:none}
.refreshpanel .rp-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;
  box-shadow:0 0 0 0 rgba(79,157,105,.36);animation:refresh-pulse 1.6s ease-out infinite}
.refreshpanel .rp-copy{min-width:0;flex:1}
.refreshpanel .rp-title{font-weight:700;color:var(--ink)}
.refreshpanel .rp-detail{margin-left:7px;color:var(--faint)}
.refreshpanel .rp-action{min-height:32px;border:0;border-bottom:1px solid currentColor;background:none;
  color:var(--dim);font:700 11px var(--mono);padding:4px 1px;cursor:pointer;white-space:nowrap}
.refreshpanel .rp-action:hover{color:var(--ink)}
.refreshpanel .rp-action:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.refreshpanel .rp-action[hidden]{display:none}
.refreshpanel.is-error{border-color:var(--pink)}
.refreshpanel.is-error .rp-dot{background:var(--pop);animation:none}
.refreshpanel.is-done .rp-dot{animation:none}
@keyframes refresh-pulse{70%{box-shadow:0 0 0 6px rgba(79,157,105,0)}100%{box-shadow:0 0 0 0 rgba(79,157,105,0)}}

/* 管理员口令只在需要创建新任务时询问；保持成轻量原生 dialog，避免打断页面视觉。 */
.authdialog{width:min(390px,calc(100vw - 32px));border:1.5px solid var(--ink);border-radius:14px;
  background:var(--card);color:var(--ink);padding:0;box-shadow:5px 5px 0 var(--hard)}
.authdialog::backdrop{background:rgba(27,22,17,.32);backdrop-filter:blur(2px)}
.authform{padding:19px 20px 17px}
.authform h2{font-size:15px;margin:0 0 5px}
.authform p{font-size:12px;color:var(--dim);margin:0 0 14px}
.authform label{display:block;font:700 10.5px var(--mono);letter-spacing:.08em;margin-bottom:5px}
.authform input{width:100%;height:42px;border:1.5px solid var(--ink);border-radius:9px;background:var(--paper);
  color:var(--ink);font:14px var(--mono);padding:7px 10px}
.authform input:focus{outline:2px solid var(--green);outline-offset:2px}
.auth-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.auth-actions button{min-height:40px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);
  color:var(--ink);font:700 11px var(--mono);padding:7px 14px;cursor:pointer}
.auth-actions .auth-submit{background:var(--ink);color:var(--paper)}
.auth-actions button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* data error / notes banner */
.banner{border:1.5px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13px;background:var(--yellow);box-shadow:3px 3px 0 var(--hard);color:#1b1611}
.banner.err{background:var(--pink)}
.banner b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;display:block;margin-bottom:4px}

/* overview bento strip */
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
.ov .tile{border:1.5px solid var(--ink);border-radius:16px;padding:13px 16px 11px;cursor:pointer;
  box-shadow:3px 3px 0 var(--hard);transition:transform .15s var(--ease),box-shadow .15s var(--ease);
  text-decoration:none;color:#1b1611;display:block;min-width:0}
.ov .tile:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
.ov .tile .lb{opacity:.65}
.ov .tile .big{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.ov .tile .sub{font-size:11.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov .t-sale{background:var(--green);color:#fff}.ov .t-sale .lb{color:rgba(255,255,255,.8)}
.ov .t-up{background:var(--yellow)}
.ov .t-ru{background:var(--pink)}
.ov .t-chg{background:var(--card);color:var(--ink)}
@media (max-width:680px){.ov{grid-template-columns:1fr 1fr}}

/* sticky zone: filters + day rail */
.stick{position:sticky;top:0;z-index:30;background:var(--stickbg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1.5px solid var(--ink);margin:0 -22px;padding:0 22px}
.rail{display:flex;gap:7px;align-items:center;padding:11px 0 9px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;white-space:nowrap;flex:none;
  color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:999px;
  padding:4px 12px;cursor:pointer;transition:.15s var(--ease);display:inline-flex;align-items:center;gap:7px}
.chip:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--hard)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip .ad{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid rgba(27,22,17,.35)}
.chip[aria-pressed="true"] .ad{border-color:rgba(250,246,239,.6)}
.chip .c{opacity:.55;font-variant-numeric:tabular-nums}
.rail .sep{width:1.5px;height:16px;background:var(--ink);flex:none;margin:0 3px;opacity:.3}

/* day rail */
.dayrail{display:flex;gap:5px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.dayrail::-webkit-scrollbar{display:none}
/* button 默认不继承文字色，用的是浏览器 buttontext（黑）。浅色下碰巧看不出来，
   深色下就是黑字黑底（实测对比度 1.13）。必须显式声明。 */
.day{flex:none;width:50px;border:1.5px solid transparent;border-radius:11px;background:none;cursor:pointer;
  padding:6px 0;text-align:center;font-family:var(--mono);color:var(--ink);transition:.15s var(--ease)}
.day:hover{border-color:var(--ink)}
.day .dw{font-size:9px;letter-spacing:.08em;color:var(--faint)}
.day .dd{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.day .dots{display:flex;gap:3px;justify-content:center;margin-top:4px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day .dots i.g{background:var(--green)} .day .dots i.y{background:var(--amber-dk)}
.day.today{background:var(--ink);color:var(--paper)}
.day.today .dw{color:rgba(250,246,239,.6)}
.day.has{box-shadow:inset 0 0 0 1.5px var(--line)}

/* timeline */
.gig-month{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.2em;color:var(--faint);margin:28px 0 4px;text-transform:uppercase}
.gig-month::after{content:"";flex:1;height:1.5px;background:var(--line)}
.gig{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1.5px solid var(--line)}
.gig .gd{flex:none;width:56px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.gig .gd .m{font-size:15px;font-weight:700}
.gig .gd .w{font-size:9px;color:var(--faint);letter-spacing:.1em}
.atag{flex:none;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:2.5px 10px;
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1.5px solid var(--ink);cursor:pointer}
.atag:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--hard)}
.gig .gt{flex:1;min-width:0}
.gig .gt .t{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gig .gt .t .nw{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--mag-dk);letter-spacing:.14em;margin-left:7px;vertical-align:2px}
.uv{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;line-height:1.5;
  color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 5px;margin-left:6px;vertical-align:1px}
.gig .gt .m2{font-size:11.5px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gig .gs{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.08em;font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:5px}
.gig .gs.on{color:var(--green-dk)} .gig .gs.up{color:var(--amber-dk)} .gig .gs.so{color:var(--dim)}
.gig .gs i{width:6px;height:6px;border-radius:50%;background:currentColor}
.gig .ga{flex:none}
.gig .ga a{font-family:var(--mono);font-size:10px;font-weight:700;color:#1b1611;text-decoration:none;
  border:1.5px solid #1b1611;border-radius:999px;padding:3.5px 11px;background:var(--yellow);transition:.15s;display:inline-block}
.gig .ga a:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--hard)}
.emptyline{padding:26px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;border:1.5px dashed var(--dashline);border-radius:14px;margin-top:20px;background:var(--emptybg)}

/* bottom modules */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
@media (max-width:680px){.mods{grid-template-columns:1fr}}
.mod{border:1.5px solid var(--ink);border-radius:16px;background:var(--card);padding:16px 18px;box-shadow:3px 3px 0 var(--hard)}
.mod h3{margin:0 0 10px;font-size:13px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.mod h3 .lb{margin-left:auto}
.mod .rl{padding:9px 0;border-top:1.5px solid var(--line);font-size:12.5px}
.mod .rl .h{font-weight:600;line-height:1.45}
.mod .rl .h a{color:inherit}
.mod .rl .sm{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.mod .rl .sm .who{font-size:10px;font-weight:700;color:#fff;border-radius:999px;padding:1.5px 8px;border:1px solid var(--ink)}
.mod .rl .sm .src{font-family:var(--mono);font-size:10px;color:var(--mag-dk);text-decoration:none;font-weight:700}
.cred{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.cred.hi{color:var(--green-dk)} .cred.mid{color:var(--amber-dk)} .cred.lo{color:var(--faint)}
.mod .cl{padding:8px 0;border-top:1.5px solid var(--line);font-size:12.5px;display:flex;gap:9px;align-items:baseline}
.mod .cl .mk{font-family:var(--mono);font-weight:700;flex:none}
.mod .cl .mk.n{color:var(--green-dk)} .mod .cl .mk.r{color:var(--mag-dk)} .mod .cl .mk.u{color:var(--amber-dk)}
.mod .cl .inf{margin-left:auto;flex:none;font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ended */
details{margin-top:26px}
summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;color:var(--dim);display:flex;align-items:baseline;gap:10px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:.2s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
summary .lb{margin-left:auto}
.pastrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.pastrow .pd{font-family:var(--mono);flex:none;width:76px;font-variant-numeric:tabular-nums}
.pastrow .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

footer{margin-top:44px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-align:center}

@media (max-width:640px){
  .hdr-right{width:100%;min-width:0;gap:4px}
  header .meta{flex:1;min-width:0}
  .hdr-actions{gap:0}
  .gig .gd{width:46px}
  .atag{max-width:74px;font-size:10px;padding:2px 7px}
  /* 手机上标题是最长的字段，单行截断会让同一巡演的各分站完全无法区分
     （9 条全是「BABYMONSTER...」），放开到三行；带「购票」按钮的在售行
     让按钮折到下一行右对齐，不再挤压标题宽度 */
  .gig{flex-wrap:wrap}
  .gig .gt .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;line-height:1.32}
  .gig .ga{flex-basis:100%;display:flex;justify-content:flex-end;margin-top:-2px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .refreshbtn.is-loading svg{animation:none}
  .refreshpanel .rp-dot{animation:none}
}

/* ── 深色模式（由 [data-theme] 切换，默认亮色，见 head 内联脚本）──────────────
   只换变量，不动结构与布局；荧光色块上的文字在基础样式里已固定为深墨色，
   这里只处理少数依赖环境色的细节。 */
[data-theme="dark"] .chip .ad{border-color:rgba(240,234,224,.35)}
[data-theme="dark"] .chip[aria-pressed="true"] .ad{border-color:rgba(21,19,15,.5)}
[data-theme="dark"] .themebtn .ic-sun{display:block}
[data-theme="dark"] .themebtn .ic-moon{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="wordmark"><span class="dot"></span>演唱会监控</div>
    <div class="hdr-right">
    <div class="meta">
      <div class="full-updated"><span class="fresh-dot" aria-hidden="true"></span><span id="fullupdated"></span></div>
      <div class="refresh-meta" id="refreshmeta"></div>
    </div>
    <div class="hdr-actions">
    <button class="iconbtn refreshbtn" id="refreshbtn" type="button" aria-label="完整刷新全部艺人和信息源" title="完整刷新全部艺人和信息源" aria-describedby="refreshpanel">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.2 5.8A5.5 5.5 0 1 0 13 10.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M10.6 5.8h2.8V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="iconbtn themebtn" id="themebtn" type="button" aria-label="切换亮色 / 暗色" title="切换亮色 / 暗色">
      <svg class="ic-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.2 9.8A5.4 5.4 0 0 1 6.2 2.8a5.4 5.4 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <svg class="ic-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 1.4v1.6M8 13v1.6M1.4 8H3M13 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    </div>
    </div>
  </header>

  <div class="refreshpanel" id="refreshpanel" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="rp-dot" aria-hidden="true"></span>
    <div class="rp-copy"><span class="rp-title" id="refreshtitle"></span><span class="rp-detail" id="refreshdetail"></span></div>
    <button class="rp-action" id="refreshcontinue" type="button" hidden>继续追踪</button>
  </div>

  <dialog class="authdialog" id="authdialog" aria-labelledby="authtitle" aria-describedby="authdesc">
    <form class="authform" id="authform" method="dialog">
      <h2 id="authtitle">确认完整刷新</h2>
      <p id="authdesc">将调用付费调研 API，重新获取全部艺人和已配置信息源。</p>
      <label for="authsecret">管理员刷新口令</label>
      <input id="authsecret" name="refresh-secret" type="password" autocomplete="off" required>
      <div class="auth-actions">
        <button id="authcancel" type="button">取消</button>
        <button class="auth-submit" type="submit">开始完整刷新</button>
      </div>
    </form>
  </dialog>

  <div id="bannerbox"></div>

  <!-- overview -->
  <div class="ov" id="ov"></div>

  <!-- sticky: filters + days -->
  <div class="stick">
    <div class="rail" id="rail"></div>
    <div class="dayrail" id="dayrail"></div>
  </div>

  <!-- timeline -->
  <div id="gigs"></div>

  <!-- bottom modules -->
  <div class="mods">
    <div class="mod" id="mod-rumor">
      <h3>舆情线索<span class="lb">RUMOR · 未证实</span></h3>
      <div id="rumors"></div>
    </div>
    <div class="mod" id="mod-chg">
      <h3>本轮变化<span class="lb" id="chgsum"></span></h3>
      <div id="changes"></div>
    </div>
  </div>

  <details id="pastbox">
    <summary>已结束的场次<span class="lb" id="pastcnt"></span></summary>
    <div id="past" style="margin-top:8px"></div>
  </details>

  <footer id="gen"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const WDZH = ["周日","周一","周二","周三","周四","周五","周六"];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* data.js 加载失败时仍保留服务端完整刷新入口，用安全空数据继续初始化。 */
const DATA_UNAVAILABLE = !window.__CM_DATA__;
const D = window.__CM_DATA__ || {
  artists:[], on_sale:[], upcoming:[], ended:[], rumors:[], changes:[], notes:[], counts:{}
};
const CHANGES = D.changes || [];
if(DATA_UNAVAILABLE){
  $("bannerbox").innerHTML = `<div class="banner err"><b>DATA ERROR</b>
    当前数据文件缺失或损坏。可点击右上角刷新按钮，重新获取并发布全部数据；恢复前列表暂不可用。</div>`;
}

/* 主题切换 */
$("themebtn").addEventListener("click", ()=>{
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("cm-theme", next); }catch(_){}
});

/* 完整刷新由后台任务执行：POST 只创建/复用任务，页面每 5 秒查询进度。
   后台执行与生产发布是两个独立阶段；只有新快照精确上线后才清除任务。 */
const refreshBtn = $("refreshbtn");
const refreshPanel = $("refreshpanel");
const refreshContinue = $("refreshcontinue");
const authDialog = $("authdialog");
const authForm = $("authform");
const authSecret = $("authsecret");
const REFRESH_JOB_KEY = "cm-full-refresh-job";
const REFRESH_SECRET_KEY = "cm-full-refresh-secret";
const REFRESH_POLL_MS = 5000;
/* Kimi 低等级账户可能只有 RPM 3：执行最长 90 分钟，完成后另给发布 15 分钟。 */
const REFRESH_EXECUTION_MAX_MS = 90*60*1000;
const REFRESH_PUBLISH_MAX_MS = 15*60*1000;
const BASE_FULL_REFRESH_AT = D.full_refresh_at || "";
let refreshTracking = false;
let authResolve = null;
let refreshActionMode = "resume";

const sleep = ms => new Promise(resolve=>setTimeout(resolve, ms));
function setRefreshPanel(kind, title, detail){
  refreshPanel.hidden = false;
  refreshPanel.classList.toggle("is-error", kind==="error");
  refreshPanel.classList.toggle("is-done", kind==="done");
  $("refreshtitle").textContent = title;
  $("refreshdetail").textContent = detail || "";
  refreshContinue.hidden = true;
}
function setRefreshBusy(busy){
  refreshBtn.disabled = busy;
  refreshBtn.classList.toggle("is-loading", busy);
  const label = busy ? "完整刷新正在进行" : "完整刷新全部艺人和信息源";
  refreshBtn.setAttribute("aria-label", label);
  refreshBtn.title = label;
  if(busy) refreshBtn.setAttribute("aria-busy", "true");
  else refreshBtn.removeAttribute("aria-busy");
}
function loadRefreshJob(){
  try{
    const job = JSON.parse(localStorage.getItem(REFRESH_JOB_KEY)||"null");
    return job && job.job_id && job.status_url ? job : null;
  }catch(_){ return null; }
}
function markRefreshPaused(job, title, detail){
  saveRefreshJob(job);
  setRefreshBusy(false);
  setRefreshPanel("error", title, detail);
  refreshActionMode = "resume";
  refreshContinue.textContent = "继续追踪";
  refreshContinue.hidden = false;
  refreshBtn.setAttribute("aria-label", "继续追踪已提交的完整刷新");
  refreshBtn.title = "继续追踪已提交的完整刷新";
}
function jobHasStatusToken(job){
  try{
    const url = new URL(job.status_url, location.href);
    return url.origin===location.origin && Boolean(url.searchParams.get("status_token"));
  }catch(_){ return false; }
}
function markLegacyRefresh(job){
  saveRefreshJob(job);
  setRefreshBusy(false);
  setRefreshPanel("error", "旧任务需要重新认证",
    "状态查询已升级安全凭证；重新认证后会创建或接入当前后台任务。");
  refreshActionMode = "reauth";
  refreshContinue.textContent = "重新认证";
  refreshContinue.hidden = false;
  refreshBtn.setAttribute("aria-label", "重新认证完整刷新");
  refreshBtn.title = "重新认证完整刷新";
}
function finishAuth(value){
  if(!authResolve) return;
  const resolve = authResolve;
  authResolve = null;
  if(authDialog.open) authDialog.close();
  authSecret.value = "";
  refreshBtn.focus({preventScroll:true});
  resolve(value);
}
function requestRefreshSecret(){
  return new Promise(resolve=>{
    authResolve = resolve;
    authSecret.value = "";
    authDialog.showModal();
    requestAnimationFrame(()=>authSecret.focus());
  });
}
authForm.addEventListener("submit", ev=>{
  ev.preventDefault();
  const value = authSecret.value.trim();
  if(!value){
    authSecret.setCustomValidity("请输入管理员刷新口令");
    authSecret.reportValidity();
    return;
  }
  finishAuth(value);
});
authSecret.addEventListener("input", ()=>authSecret.setCustomValidity(""));
$("authcancel").addEventListener("click", ()=>finishAuth(""));
authDialog.addEventListener("cancel", ev=>{ ev.preventDefault(); finishAuth(""); });
async function fetchJson(url, options={}){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 12000);
  try{
    const res = await fetch(url, {...options, signal:controller.signal,
      headers:{Accept:"application/json", ...(options.headers||{})}});
    const payload = await res.json().catch(()=>({}));
    if(!res.ok || payload.ok===false){
      throw new Error(payload.error || payload.message || `请求失败 (${res.status})`);
    }
    return payload;
  }finally{ clearTimeout(timer); }
}
function statusUrlFor(raw, jobId){
  const fallback = `/api/refresh?job_id=${encodeURIComponent(jobId)}`;
  try{
    const u = new URL(raw || fallback, location.href);
    return u.origin===location.origin ? u.pathname+u.search : fallback;
  }catch(_){ return fallback; }
}
function saveRefreshJob(job){
  try{ localStorage.setItem(REFRESH_JOB_KEY, JSON.stringify(job)); }catch(_){}
}
function clearRefreshJob(){
  try{ localStorage.removeItem(REFRESH_JOB_KEY); }catch(_){}
}
function stageText(payload){
  if(payload.message) return String(payload.message);
  const stage = String(payload.stage||"").toLowerCase();
  const labels = {
    research:"正在检索全部关注艺人", collect:"正在重新抓取各信息源",
    merge:"正在合并去重与校验", build:"正在生成最新数据", deploy:"正在发布最新页面"
  };
  return labels[stage] || "后台正在重新获取全部数据";
}
async function waitForPublished(job, renewWindow=false){
  if(renewWindow || !Number(job.publish_deadline)){
    job.publish_deadline = Date.now()+REFRESH_PUBLISH_MAX_MS;
  }
  job.phase = "publishing";
  saveRefreshJob(job);
  setRefreshPanel("busy", "全部信息已重新获取", "正在发布最新页面…");
  while(Date.now()<Number(job.publish_deadline)){
    try{
      const res = await fetch(`/data.json?t=${Date.now()}`, {cache:"no-store", headers:{Accept:"application/json"}});
      if(res.ok){
        const latest = await res.json();
        const exactJobPublished = latest.full_refresh_id===job.job_id && latest.full_refresh_at &&
          latest.full_refresh_at!==(job.base_full_refresh_at == null ? BASE_FULL_REFRESH_AT : job.base_full_refresh_at);
        if(exactJobPublished){
          clearRefreshJob();
          setRefreshPanel("done", "完整刷新已完成", "正在载入最新数据…");
          await sleep(1800);
          location.reload();
          return;
        }
      }
    }catch(_){}
    await sleep(REFRESH_POLL_MS);
  }
  markRefreshPaused(job, "最新页面仍在发布",
    "15 分钟内尚未看到新快照，任务已保留；可稍后继续追踪。");
}
async function trackRefreshJob(job, renewWindow=false){
  if(refreshTracking) return;
  refreshTracking = true;
  setRefreshBusy(true);
  if(job.phase==="publishing"){
    try{ await waitForPublished(job, renewWindow); }
    finally{ refreshTracking = false; }
    return;
  }
  if(renewWindow || !Number(job.execution_deadline)){
    job.execution_deadline = Date.now()+REFRESH_EXECUTION_MAX_MS;
    saveRefreshJob(job);
  }
  let consecutiveErrors = 0;
  try{
    while(Date.now()<Number(job.execution_deadline)){
      try{
        const payload = await fetchJson(statusUrlFor(job.status_url, job.job_id));
        consecutiveErrors = 0;
        const status = String(payload.status||"").toLowerCase();
        if(status==="failed"){
          const fatal = new Error(payload.error || payload.message || "后台任务执行失败");
          fatal.refreshFatal = true;
          throw fatal;
        }
        if(status==="completed"){
          await waitForPublished(job);
          return;
        }
        if(status==="queued") setRefreshPanel("busy", "完整刷新已提交", "正在等待后台执行…");
        else setRefreshPanel("busy", "正在完整刷新", stageText(payload));
      }catch(err){
        if(err && err.refreshFatal) throw err;
        consecutiveErrors++;
        if(consecutiveErrors>=3){
          markRefreshPaused(job, "完整刷新仍在后台运行",
            "暂时无法读取进度，任务已保留；网络恢复后可继续追踪。");
          return;
        }
        setRefreshPanel("busy", "完整刷新仍在进行", "暂时无法读取进度，正在自动重试…");
      }
      await sleep(REFRESH_POLL_MS);
    }
    markRefreshPaused(job, "完整刷新跟踪已暂停",
      "90 分钟内尚未完成，后台任务不会因此中断；可稍后继续追踪。");
  }catch(err){
    /* GitHub 明确报告 failed 才允许清除；暂时性错误都保留任务。 */
    if(err && err.refreshFatal) clearRefreshJob();
    const msg = (err && err.name==="AbortError") ? "连接刷新服务超时" : (err.message||"刷新失败");
    setRefreshPanel("error", "完整刷新未完成", msg+"。当前页面数据未受影响。");
    setRefreshBusy(false);
  }finally{
    refreshTracking = false;
  }
}
function resumeSavedRefresh(){
  const job = loadRefreshJob();
  if(!job) return;
  if(!jobHasStatusToken(job)){ markLegacyRefresh(job); return; }
  trackRefreshJob(job, true);
}
function reauthenticateRefresh(){
  clearRefreshJob();
  try{ sessionStorage.removeItem(REFRESH_SECRET_KEY); }catch(_){}
  refreshPanel.hidden = true;
  setRefreshBusy(false);
  refreshBtn.click();
}
refreshContinue.addEventListener("click", ()=>{
  if(refreshActionMode==="reauth") reauthenticateRefresh();
  else resumeSavedRefresh();
});
refreshBtn.addEventListener("click", async ()=>{
  if(refreshTracking || refreshBtn.disabled || authDialog.open) return;
  const pending = loadRefreshJob();
  if(pending){
    if(jobHasStatusToken(pending)) resumeSavedRefresh();
    else reauthenticateRefresh();
    return;
  }
  try{
    let refreshSecret = "";
    try{ refreshSecret = sessionStorage.getItem(REFRESH_SECRET_KEY)||""; }catch(_){}
    if(!refreshSecret){
      refreshSecret = await requestRefreshSecret();
      if(!refreshSecret) return;
      try{ sessionStorage.setItem(REFRESH_SECRET_KEY, refreshSecret); }catch(_){}
    }
    setRefreshBusy(true);
    setRefreshPanel("busy", "正在启动完整刷新", "将重新获取全部艺人和所有已配置信息源…");
    let payload;
    try{
      payload = await fetchJson("/api/refresh", {method:"POST",
        headers:{Authorization:`Bearer ${refreshSecret}`}});
    }catch(err){
      if((err.message||"").includes("口令")){
        try{ sessionStorage.removeItem(REFRESH_SECRET_KEY); }catch(_){}
      }
      throw err;
    }
    const jobId = payload.job_id;
    if(!jobId) throw new Error("刷新服务未返回任务编号");
    const job = {job_id:String(jobId), status_url:statusUrlFor(payload.status_url, jobId),
      base_full_refresh_at:BASE_FULL_REFRESH_AT,
      phase:"executing", execution_deadline:Date.now()+REFRESH_EXECUTION_MAX_MS};
    saveRefreshJob(job);
    if(payload.already_running){
      setRefreshPanel("busy", "完整刷新已在进行", "已接入现有任务，不会重复刷新…");
    }
    setRefreshBusy(false);
    trackRefreshJob(job);
  }catch(err){
    setRefreshBusy(false);
    const msg = (err && err.name==="AbortError") ? "连接刷新服务超时" : (err.message||"无法启动刷新");
    setRefreshPanel("error", "无法启动完整刷新", msg+"。当前页面数据未受影响。");
  }
});

/* 重开页面后继续跟踪原任务。时限过期也不丢弃，由用户继续追踪。 */
const savedRefresh = loadRefreshJob();
if(savedRefresh){
  if(!jobHasStatusToken(savedRefresh)) markLegacyRefresh(savedRefresh);
  else{
    const deadline = savedRefresh.phase==="publishing"
      ? Number(savedRefresh.publish_deadline) : Number(savedRefresh.execution_deadline || savedRefresh.deadline);
    if(deadline>Date.now()) setTimeout(()=>trackRefreshJob(savedRefresh), 0);
    else markRefreshPaused(savedRefresh, "有一次完整刷新待追踪",
      "任务依然已保留，继续追踪不会重复创建刷新。");
  }
}
const firstUrl = e => ((e.sources||[]).find(s=>s.url)||{}).url;
const pdate = d => { if(!d) return null; const [Y,M,Dd]=d.split("-").map(Number); const dt=new Date(Y,M-1,Dd);
  if(isNaN(dt)) return null;
  return {md:M+"/"+String(Dd).padStart(2,"0"), w:WDZH[dt.getDay()], m: Y+"."+String(M).padStart(2,"0")}; };

/* filter state（持久化，容错） */
let filter = {region:"all", artist:"all"};
try{
  const saved = JSON.parse(localStorage.getItem("cm-filter")||"null");
  if(saved && typeof saved==="object") filter = {region:saved.region||"all", artist:saved.artist||"all"};
}catch(_){}
function saveFilter(){ try{ localStorage.setItem("cm-filter", JSON.stringify(filter)); }catch(_){} }

/* per-artist dopamine color ladder */
const PALETTE = ["#e23e2e","#f07f13","#c99200","#5f9e00","#2f8f4e","#159a8c",
                 "#1295b8","#3d6fd8","#7a5be0","#a24fd0","#d1489e","#e0526b"];
const ACOLOR = {};
(D.artists||[]).forEach((a,i)=> ACOLOR[a.key] = PALETTE[i % PALETTE.length]);
const atag = (key,name) => `<span class="atag" role="button" tabindex="0" data-artist="${esc(key)}" style="background:${ACOLOR[key]||"#7d7263"}" title="只看 ${esc(name)}">${esc(name)}</span>`;

/* header */
(function(){
  const fmt = s => s ? s.replace("T"," ").slice(0,16) : "--";
  const fullAt = D.full_refresh_at || "";
  const shownAt = fullAt || D.last_research_at || D.generated_at || "";
  const parseShanghai = s => {
    if(!s) return null;
    const zoned = /(?:Z|[+-]\d\d:\d\d)$/.test(s) ? s : s+"+08:00";
    const d = new Date(zoned);
    return isNaN(d) ? null : d;
  };
  const ago = s => {
    const d = parseShanghai(s); if(!d) return "";
    const mins = Math.max(0, Math.floor((Date.now()-d.getTime())/60000));
    if(mins<2) return "刚刚";
    if(mins<60) return mins+"分钟前";
    const hours = Math.floor(mins/60);
    if(hours<24) return hours+"小时前";
    const days = Math.floor(hours/24);
    return days<30 ? days+"天前" : "";
  };
  const paintFreshness = ()=>{
    const rel = ago(shownAt);
    $("fullupdated").textContent = (fullAt ? "全源采集完成于 " : "数据基线更新于 ") + fmt(shownAt) + (rel ? " · "+rel : "");
  };
  paintFreshness();
  setInterval(paintFreshness, 60000);
  $("refreshmeta").textContent = DATA_UNAVAILABLE
    ? "数据基线不可用 · 手动刷新可重新获取全部来源"
    : `手动刷新会重新获取 ${(D.artists||[]).length} 位艺人的全部来源`;
  $("fullupdated").parentElement.title = fullAt
    ? `最近一次全源采集完成：${fmt(fullAt)}`
    : "尚无完整刷新记录，当前显示已部署的数据基线";
  $("gen").textContent = "页面数据生成于 " + fmt(D.generated_at) + " · 巡查任务 " + (D.last_run_id||"--");
})();

/* notes / degrade banner */
if((D.notes||[]).length){
  $("bannerbox").innerHTML = `<div class="banner"><b>本轮降级提示</b>${D.notes.map(x=>`<div>· ${esc(x)}</div>`).join("")}</div>`;
}

const cnt = D.counts||{};
const news = CHANGES.filter(c=>c.type==="new"), rms = CHANGES.filter(c=>c.type==="rumor"),
      upds = CHANGES.filter(c=>c.type!=="new" && c.type!=="rumor");

/* overview tiles */
(function(){
  const on = D.on_sale||[], up = D.upcoming||[];
  const nextOn = on[0], nextUp = up.find(e=>e.sale_time) || up.find(e=>e.show_date);
  const sub = e => e ? `${e.show_date?e.show_date.slice(5).replace("-","/"):"待定"} ${e.artist_name}` : "—";
  $("ov").innerHTML =
    `<a class="tile t-sale" href="#gigs"><div class="lb">ON SALE · 正在售卖</div>
       <div class="big">${cnt.on_sale||0}</div><div class="sub">最近 ${esc(sub(nextOn))}</div></a>
     <a class="tile t-up" href="#gigs"><div class="lb">UPCOMING · 待开票</div>
       <div class="big">${cnt.upcoming||0}</div><div class="sub">${nextUp&&nextUp.sale_time?"开票 "+esc(nextUp.sale_time.slice(5,10).replace("-","/"))+" "+esc(nextUp.artist_name):"开票时间均待公布"}</div></a>
     <a class="tile t-ru" href="#mod-rumor"><div class="lb">RUMOR · 舆情线索</div>
       <div class="big">${cnt.rumors||0}</div><div class="sub">${esc((D.rumors&&D.rumors[0])?D.rumors[0].artist_name+" 等":"—")}</div></a>
     <a class="tile t-chg" href="#mod-chg"><div class="lb">CHANGES · 本轮变化</div>
       <div class="big">+${news.length}</div><div class="sub">舆情 ${rms.length} 条 · 更新 ${upds.length} 条</div></a>`;
})();

/* filter rail */
function allItems(){ return [...(D.on_sale||[]), ...(D.upcoming||[]), ...(D.rumors||[])]; }
function syncPressed(){
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",
    String((c.dataset.r && c.dataset.r===filter.region && filter.artist==="all") ||
           (c.dataset.a && c.dataset.a===filter.artist))));
}
(function(){
  const cntA = k => allItems().filter(e=>e.artist_key===k).length;
  let html = `<button class="chip" data-r="all">全部</button>
    <button class="chip" data-r="cn">国内</button>
    <button class="chip" data-r="kpop">K-Pop</button><span class="sep"></span>`;
  html += (D.artists||[]).map(a=>
    `<button class="chip" data-a="${esc(a.key)}"><span class="ad" style="background:${ACOLOR[a.key]}"></span>${esc(a.name)} <span class="c">${cntA(a.key)}</span></button>`).join("");
  $("rail").innerHTML = html;
  $("rail").addEventListener("click", ev=>{
    const b = ev.target.closest(".chip"); if(!b) return;
    if(b.dataset.r) filter = {region:b.dataset.r, artist:"all"};
    else filter = {region:"all", artist: filter.artist===b.dataset.a ? "all" : b.dataset.a};
    saveFilter(); syncPressed(); render();
  });
  syncPressed();
})();
/* artist tag click → filter by that artist */
document.addEventListener("click", ev=>{
  const t = ev.target.closest(".atag"); if(!t) return;
  filter = {region:"all", artist: t.dataset.artist};
  saveFilter(); syncPressed(); render();
  window.scrollTo({top:0,behavior:"smooth"});
});
/* 艺人标签是 span，补上键盘操作（Enter / 空格），与 chip 的可达性保持一致 */
document.addEventListener("keydown", ev=>{
  if(ev.key!=="Enter" && ev.key!==" ") return;
  const t = ev.target.closest && ev.target.closest(".atag"); if(!t) return;
  ev.preventDefault(); t.click();
});

function keep(item){
  if(filter.artist!=="all") return item.artist_key===filter.artist;
  if(filter.region!=="all"){
    const a = (D.artists||[]).find(x=>x.key===item.artist_key);
    return a && (filter.region==="kpop" ? a.region==="kpop" : a.region!=="kpop");
  }
  return true;
}

/* main render */
function render(){
  const evts = [...(D.on_sale||[]).map(e=>({...e,_st:"on_sale"})), ...(D.upcoming||[]).map(e=>({...e,_st:"upcoming"}))]
    .filter(keep);
  const datedL = evts.filter(e=>e.show_date).sort((a,b)=>a.show_date<b.show_date?-1:1);
  const undatedL = evts.filter(e=>!e.show_date);

  /* day rail */
  const byDate = {};
  datedL.forEach(e=>{ (byDate[e.show_date]=byDate[e.show_date]||[]).push(e); });
  const today = new Date(); today.setHours(0,0,0,0);
  let r = "";
  for(let i=0;i<45;i++){
    const d = new Date(today.getTime()+i*86400000);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const evs = byDate[key]||[];
    const dots = [...new Set(evs.map(e=>e._st))].map(s=>`<i class="${s==="on_sale"?"g":"y"}"></i>`).join("");
    r += `<button class="day ${i===0?"today":""} ${evs.length?"has":""}" ${evs.length?`onclick="document.getElementById('g${key}')?.scrollIntoView({behavior:'smooth',block:'center'})"`:""}>
      <div class="dw">${i===0?"今天":WDZH[d.getDay()]}</div><div class="dd">${d.getMonth()+1}/${d.getDate()}</div>
      <div class="dots">${dots}</div></button>`;
  }
  $("dayrail").innerHTML = r;

  /* timeline rows */
  let h = "", lastM = "";
  const seenDates = new Set();
  for(const e of datedL){
    const p = pdate(e.show_date); if(!p) continue;
    if(p.m!==lastM){ h += `<div class="gig-month">${p.m}</div>`; lastM = p.m; }
    const on = e._st==="on_sale"; const url = firstUrl(e);
    /* 售罄仍在时间线上（可能加场/二次放票），但状态显示为售罄且不给购票按钮 */
    const so = e.sale_status==="sold_out" || e.sale_status==="售罄";
    /* 同一天可能有多场，锚点只挂在当天第一条上，否则会出现重复 id，
       日期条点击也只会跳到第一条 */
    const anchor = seenDates.has(e.show_date) ? "" : ` id="g${e.show_date}"`;
    seenDates.add(e.show_date);
    /* note / 票档 / 阵容在紧凑单行里放不下，挂进原生 tooltip，信息不至于丢失 */
    const tip = [e.title, e.tour_name, [e.city, e.venue].filter(Boolean).join(" "),
                 e.note, (e.ticket_tiers||[]).join("  ·  "),
                 e.performers ? "阵容：" + e.performers : ""].filter(Boolean).join("\n");
    h += `<div class="gig"${anchor} title="${esc(tip)}">
      <div class="gd"><div class="m">${p.md}</div><div class="w">${p.w}</div></div>
      ${atag(e.artist_key, e.artist_name)}
      <div class="gt"><div class="t">${esc(e.title)}${e.is_new?'<span class="nw">NEW</span>':""}${e.verification_status==="unverified"?'<span class="uv">本轮未复核</span>':""}</div>
        <div class="m2">${esc([e.city,e.venue,e.show_time,e.price,e.note].filter(Boolean).join(" · "))}</div></div>
      <div class="gs ${so?"so":(on?"on":"up")}"><i></i>${so?"售罄":(on?"在售":(e.sale_time?"SALE "+e.sale_time.slice(5).replace("-","/"):"待开票"))}</div>
      ${on&&!so&&url?`<div class="ga"><a href="${esc(url)}" target="_blank" rel="noopener">购票 ↗</a></div>`:""}
    </div>`;
  }
  if(undatedL.length){
    h += `<div class="gig-month">日期待定</div>` + undatedL.map(e=>
      `<div class="gig"><div class="gd"><div class="m" style="color:var(--faint)">—</div><div class="w">待定</div></div>
        ${atag(e.artist_key, e.artist_name)}
        <div class="gt"><div class="t">${esc(e.title)}${e.is_new?'<span class="nw">NEW</span>':""}${e.verification_status==="unverified"?'<span class="uv">本轮未复核</span>':""}</div><div class="m2">城市与开票时间待公布</div></div>
        <div class="gs up"><i></i>待官宣</div></div>`).join("");
  }
  $("gigs").innerHTML = h || `<div class="emptyline">当前筛选下没有场次 · 点击「全部」重置</div>`;

  /* rumors */
  const ru = (D.rumors||[]).filter(keep);
  $("rumors").innerHTML = ru.map(x=>{
    const cred = {high:['hi','可信度高'],medium:['mid','可信度中'],low:['lo','待证实']}[x.credibility]||['lo','待证实'];
    return `<div class="rl"><div class="h">${esc(x.headline)}</div>
      ${x.detail?`<div style="color:var(--dim);font-size:12px;margin-top:3px">${esc(x.detail)}</div>`:""}
      <div class="sm"><span class="who" style="background:${ACOLOR[x.artist_key]||"#7d7263"}">${esc(x.artist_name)}</span>
      <span class="cred ${cred[0]}">● ${cred[1]}</span>${x.verification_status==="unverified"?'<span class="uv">本轮未复核</span>':""}
      ${x.posted_at?`<span class="lb">${esc(x.posted_at)}</span>`:""}
      ${x.url?`<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a>`:""}</div></div>`;
  }).join("") || `<div class="rl" style="color:var(--faint)">当前筛选下没有舆情</div>`;

  /* 本轮变化：只反映最近一次巡查的结果，无变化时显式显示为 0 */
  $("chgsum").textContent = CHANGES.length ? `NEW ${news.length} · RUMOR ${rms.length} · UPD ${upds.length}` : "";
  const mkMap = {new:["+","n"], rumor:["?","r"], status:["↻","u"], sale_time:["票","u"]};
  $("changes").innerHTML = CHANGES.map(c=>{
    const [mk,cls] = mkMap[c.type]||["·","u"];
    return `<div class="cl"><span class="mk ${cls}">${mk}</span>
      <span>${esc(c.artist)} · ${esc(c.title)}</span>
      ${c.info?`<span class="inf">${esc(c.info.slice(0,14))}</span>`:""}</div>`;
  }).join("") || `<div class="cl" style="color:var(--faint)">最近一次巡查没有新变化</div>`;

  /* ended */
  const pa = (D.ended||[]).filter(keep);
  $("pastcnt").textContent = pa.length ? pa.length+" 场" : "";
  $("past").innerHTML = pa.map(e=>
    `<div class="pastrow"><span class="pd">${esc(e.show_date||"—")}</span>
     <span class="pt">${esc(e.artist_name)} · ${esc(e.title)}${e.verification_status==="unverified"?'<span class="uv">本轮未复核</span>':""}</span>
     <span>${esc(e.city||"")}</span></div>`).join("") || `<div class="pastrow">（无）</div>`;
  $("pastbox").hidden = !(D.ended||[]).length;
}
render();
})();
</script>
</body>
</html>
